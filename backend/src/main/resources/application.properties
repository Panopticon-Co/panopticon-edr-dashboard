server.port=8788
spring.application.name=panopticon-backend-service

# Database configuration (SQLite with WAL mode)
spring.datasource.url=jdbc:sqlite:${PANOPTICON_DB_PATH:C:/Users/jiten/.gemini/antigravity/scratch/panopticon-backend-service/panopticon.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/schema.sql

# Panopticon Detection & Manager Integration
panopticon.alerts.file-path=${PANOPTICON_ALERTS_FILE:C:/Users/jiten/.gemini/antigravity/scratch/panopticon-console/alerts.ndjson}
panopticon.manager.url=${PANOPTICON_MANAGER_URL:http://127.0.0.1:8000}
panopticon.manager.token=${PANOPTICON_MANAGER_TOKEN:mock-analyst-token}

# Spring Security default credentials
spring.security.user.name=admin
spring.security.user.password=panopticon

# Logging
logging.level.com.panopticon=INFO
logging.level.org.springframework.web=INFO
